##########################################################################

name: 'scala-service-template'

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
    types: [opened, reopened, synchronize]
env:
  GIT_SHA_LONG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  MAVEN_REPO_USER: ${{ secrets.MAVEN_REPO_USER }}
  MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ env.GIT_SHA_LONG }}

      - name: Checkout GitHub Actions Repo
        uses: actions/checkout@v2
        with:
          repository: dixahq/github-actions
          path: .github/actions
          token: ${{ secrets.DIXAROBOT_GITHUB_READONLY_TOKEN }}

      - name: Setup Scala and sbt
        uses: olafurpg/setup-scala@v11

      - name: Set up local DynamoDB
        uses: './.github/actions/dynamodb-local'

      - name: Run test coverage report
        run: sbt -Dfile.encoding=utf-8 coverage test coverageReport

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v2.2.4
        with:
          name: Scoverage Report
          path: target/scala*/scoverage-report/scoverage.xml

      - name: Package sbt artifacts for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: sbt stage

      - name: Package sbt artifacts for main branches
        if: ${{ github.event_name == 'push' }}
        run: sbt "release with-defaults"

      - name: 'Docker build and push'
        id: docker-build-push
        uses: './.github/actions/docker-build-push'

    outputs:
      sha-short: ${{ steps.docker-build-push.outputs.sha-short }}
      docker-image-tag: ${{ steps.docker-build-push.outputs.docker-image-tag }}

