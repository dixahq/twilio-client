name: 'twilio-client'

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
    types: [opened, reopened, synchronize]
env:
  GIT_SHA_LONG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  MAVEN_REPO_USER: ${{ secrets.MAVEN_REPO_USER }}
  MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
jobs:
  build:
    runs-on: ["self-hosted", "default"]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ env.GIT_SHA_LONG }}

      - name: Checkout GitHub Actions Repo
        uses: actions/checkout@v2
        with:
          repository: dixahq/github-actions
          path: .github/actions
          token: ${{ secrets.DIXAROBOT_GITHUB_READONLY_TOKEN }}

      - name: Setup Scala and sbt
        uses: olafurpg/setup-scala@v11

      - name: Run tests
        run: sbt test

      # Release and publish modules
      - name: Get the email of the commit author
        if: ${{ endsWith(github.ref,'/master') && !contains(steps.commit-author.outputs.email, 'hello@dixa.com') }}
        run: echo "::set-output name=email::$(git show -s --format='%ae')"
        id: commit-author

      - name: Setting DixaRobot as the Git user
        if: ${{ endsWith(github.ref,'/master') && !contains(steps.commit-author.outputs.email, 'hello@dixa.com') }}
        run: git config --global user.email "hello@dixa.com" && git config --global user.name "DixaRobot"

      - name: Checkout master branch
        if: ${{ endsWith(github.ref,'/master') && !contains(steps.commit-author.outputs.email, 'hello@dixa.com') }}
        uses: actions/checkout@v2
        with:
          ref: 'master'
          token: ${{ secrets.DIXAROBOT_GITHUB_READONLY_TOKEN }}

      - name: Release and publish artifacts
        if: ${{ endsWith(github.ref,'/master') && !contains(steps.commit-author.outputs.email, 'hello@dixa.com') }}
        run: sbt "release cross with-defaults skip-tests"
