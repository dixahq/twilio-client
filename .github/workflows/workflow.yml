name: 'twilio-client'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build-test:
    if: github.ref != 'refs/heads/master'
    uses: dixahq/github-actions/.github/workflows/sbt-release.yml@main
    secrets: inherit
    with:
      sbt_task: '"+test"'
  release:
    if: github.ref == 'refs/heads/master'
    uses: dixahq/github-actions/.github/workflows/sbt-release.yml@main
    secrets: inherit
    with:
      sbt_task: '"release with-defaults"'

