org.apache.pekko.loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
# Weirdly, this is necessary in tests
org.apache.pekko.logger-startup-timeout = 30s


conversation-service {
  bind-address = "0.0.0.0:7001"
}

rpc {
  organization = "localhost:3000"

  telephony = "localhost:8003"

  stats = "localhost:8013"

  presence = "localhost:4000"

  queue = "localhost:7002"

  email = "localhost:2003"

  tags = "localhost:2002"

  podio = "localhost:8000"

  integrations = "localhost:8001"

  offer = "localhost:9500"

  conversation-transfer = "localhost:9600"

  facebook-messenger = "localhost:9700"

  smooch = "localhost:9800"

  search = "localhost:9000"
}

dynamodb {
  access-key-id = "some-random-key"
  secret-key = "some-random-secret-for-test"
  endpoint-url = "http://localhost:8080"
}

sqs {
  aws-key = "some-random-key"
  aws-secret = "some-random-secret-for-test"
  endpoint = "http://localhost:8080"

}

